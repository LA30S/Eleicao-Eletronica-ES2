<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title> Sistema Eleição Eletrônica </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Blank</ion-title>
    </ion-toolbar>
  </ion-header>

  <br>
  Bem-Vindo ao Sistema de Eleição Eletrônica
  <br>
  <br>
  <br>
  Login
  <br>
  <br>

  <!-- Formulario de login -->
  <form (ngSubmit)="fazerLogin()">

    <ion-input
      label="Código de Acesso"
      name="codigoAcesso"
      [(ngModel)]="codigoAcesso"
      required
    ></ion-input>
    <br>
    <ion-input
      label="Senha"
      name="senha"
      [(ngModel)]="senha"
      required
    ></ion-input>
    <br>
    <ion-button type="submit">Entrar</ion-button>

  </form>

</ion-content>
